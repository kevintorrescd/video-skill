<!DOCTYPE html>
<html lang="es" data-duration="6s">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>GOLGOTHA ACADEMY · Lower Third</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="scene">

    <!--
      This is an overlay component.
      The scene background is transparent to allow compositing
      over video or other scenes.
    -->

    <!-- Lower Third -->
    <div id="lower-third" class="lower-third" style="opacity: 0; transform: translateX(-300px);">

      <!-- Green accent bar -->
      <div class="lower-third__accent"></div>

      <!-- Text content -->
      <div class="lower-third__content">
        <div class="lower-third__name">{{speaker_name}}</div>
        <div class="lower-third__role">{{speaker_role}}</div>
      </div>

    </div>

  </div>

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const el       = document.getElementById('lower-third');
      const holdTime = 4; // seconds to keep visible

      const tl = gsap.timeline({ defaults: { ease: 'power2.out' } });

      // 1. Slide in from left
      tl.to(el, {
          x: 0,
          opacity: 1,
          duration: 0.5,
        })
        // 2. Hold position
        .to(el, { duration: holdTime })
        // 3. Slide back out to left
        .to(el, {
          x: -300,
          opacity: 0,
          duration: 0.4,
          ease: 'power2.in',
        });
    });
  </script>

</body>
</html>
